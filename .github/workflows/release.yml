# Tag vX.Y.Z on main -> build, test, publish, attest, GitHub release.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check the tag against VERSION and CHANGELOG.md
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version" }
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)").Groups[1].Value.Trim()
          if (-not $notes) { throw "CHANGELOG.md has no section for $version" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - run: dotnet restore ArcadePcAgent.slnx

      - run: dotnet build ArcadePcAgent.slnx --no-restore -c Release -warnaserror

      - run: dotnet test tests/ArcadePcAgent.Core.Tests --no-build -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/ArcadePcAgent -c Release -o artifacts/publish -p:Version="${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item artifacts/publish/ArcadePcAgent.exe dist/
          Copy-Item scripts/install-arcade-pc-agent.ps1 dist/

      - name: Build the installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"
          Copy-Item "artifacts/installer/ArcadePcAgent-Setup-${{ steps.version.outputs.version }}.exe" dist/

      - name: Checksums
        shell: pwsh
        run: |
          Push-Location dist
          # LF line endings, so `sha256sum -c` / `shasum -a 256 -c` work on Linux and macOS.
          $lines = Get-ChildItem -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS'), (($lines -join "`n") + "`n"))
          Pop-Location
          Get-Content dist/SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/ArcadePcAgent-Setup-${{ steps.version.outputs.version }}.exe
            dist/ArcadePcAgent.exe
            dist/install-arcade-pc-agent.ps1

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "dist/ArcadePcAgent-Setup-${{ steps.version.outputs.version }}.exe" dist/ArcadePcAgent.exe dist/install-arcade-pc-agent.ps1 dist/SHA256SUMS `
            --title "ha-arcade-pc-agent ${{ steps.version.outputs.version }}" --notes-file release-notes.md --verify-tag
