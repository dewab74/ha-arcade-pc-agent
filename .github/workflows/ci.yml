name: build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Core is platform-neutral; Windows is where the agent actually runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Locked mode (CI=true in Directory.Build.props): a stale packages.lock.json fails here.
      - run: dotnet restore ArcadePcAgent.slnx

      - run: dotnet build ArcadePcAgent.slnx --no-restore -c Release -warnaserror

      - run: dotnet test tests/ArcadePcAgent.Core.Tests --no-build -c Release

      # The exe a release would ship, for testing a PR on a real PC.
      - name: Publish the exe and build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$((Get-Content VERSION -Raw).Trim())-ci.${{ github.run_number }}"
          dotnet publish src/ArcadePcAgent -c Release -o artifacts/publish -p:Version="$version"
          ./scripts/build-installer.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ArcadePcAgent-${{ github.sha }}
          path: |
            artifacts/installer/ArcadePcAgent-Setup-*.exe
            artifacts/publish/ArcadePcAgent.exe
            scripts/install-arcade-pc-agent.ps1
          retention-days: 14
